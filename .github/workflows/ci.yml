name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ShellCheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: 仓库结构与 Shell 校验
        run: |
          scripts/validate.sh
          shellcheck scripts/*.sh
      - name: 两个技能的单元测试
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: 可复现独立打包
        run: |
          python3 scripts/package-skill.py ui-craft
          python3 scripts/package-skill.py explain-business-visually
      - name: 示例与业务图解 fixture 审计
        run: |
          python3 skills/ui-craft/scripts/audit_ui.py --path skills/ui-craft/assets/technical-explainer.html --strict
          for fixture in evals/explain-business-visually/fixtures/*; do
            python3 skills/explain-business-visually/scripts/audit_explainer.py --page "$fixture/index.html" --manifest "$fixture/content.json"
          done
