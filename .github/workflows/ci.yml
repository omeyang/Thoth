name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Skill 结构与 Markdown 本地链接
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path.cwd()
          errors = []
          for name in ("explain-business-visually", "ui-craft", "verify-business-reality"):
              entry = root / "skills" / name / "SKILL.md"
              text = entry.read_text(encoding="utf-8")
              if not text.startswith("---\n") or f"name: {name}\n" not in text:
                  errors.append(f"{entry}: frontmatter/name 不正确")
          for path in root.glob("**/*.md"):
              text = path.read_text(encoding="utf-8")
              for target in re.findall(r"\[[^]]+\]\(([^)]+)\)", text):
                  if "://" in target or target.startswith("#"):
                      continue
                  clean = target.split("#", 1)[0]
                  if clean and not (path.parent / clean).resolve().exists():
                      errors.append(f"{path}: 链接不存在：{target}")
          for path in (root / "tools", root / "scripts", root / "skills" / "explain-business-visually" / "scripts"):
              if path.exists():
                  errors.append(f"纯 Skill 架构不应包含：{path}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("Skill structure and local Markdown links: OK")
          PY
